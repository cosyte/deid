name: Public-surface gate

# No internal project bookkeeping on a surface a consumer reads: item identifiers, phase and wave
# language, ADR numbers, internal paths and traceability markers belong in the changeset, the
# commit, the PR and the umbrella's plans, never in README.md, docs-content/, the npm description
# and keywords, the doc comments that compile into the shipped type declarations, or a disposition message a consumer reads in their logs.
#
# The scan is `pnpm check:no-internal-refs`, the shared gate from `@cosyte/script-utils`
# (`cosyte-internal-refs`, ST34). This repository keeps only its axes, rules and self-test samples
# in `scripts/internal-refs.json`. The bin comes from the installed dependencies, so this calls the
# INSTALLING variant of the shared gate workflow.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named `<caller job id> / <inner job id>`,
# so the job id `no-internal-refs` below publishes `no-internal-refs / public-surface`, the context
# the ruleset requires. Renaming the job detaches that requirement with no error anywhere.
#
# It does not read the PR title, body or commit messages, where identifiers belong, so there is no
# `edited` trigger. The release body is checked by the shared release pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # A published reference (ST37): a `workflows-*` release of cosyte/.github. Those releases
    # are immutable, so the tag is locked to one commit, and every caller in this repository
    # moves to the next reference together.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    # No more than the scan needs: it installs and reads the tree.
    permissions:
      contents: read
