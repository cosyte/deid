name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish (provenance auto-enables when
# this repo is public) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# Requires the NPM_TOKEN and DOCS_REPO_DISPATCH_TOKEN secrets (passed via `secrets: inherit`).
#
# ▶ THE "Version Packages" PR THIS OPENS WILL SIT BLOCKED UNTIL SOMEONE PUSHES TO IT. That is the
# expected state, not a broken pipeline. Changesets opens it as `github-actions[bot]` with the
# default GITHUB_TOKEN, and GitHub does not start workflow runs for events raised by that token, so
# the PR gets ZERO check runs. The `ci-required-checks` ruleset on `main` requires several contexts
# (the count has already moved once, so read it with `gh api repos/cosyte/deid/rulesets/19907854`
# rather than from any comment, including this one), and a required context that
# never arrives is pending, not failing, so the PR is unmergeable and nobody can bypass it
# (`bypass_actors` is empty on purpose). One commit onto `changeset-release/main` fires
# `pull_request: synchronize` under a real user and produces all of them:
#
#   gh pr checkout <n> -R cosyte/deid
#   git commit --allow-empty -m "chore: run CI on the version PR"
#   git push
#
# Do the push LAST, immediately before merging. If another changeset lands on `main` while the
# version PR is open, this workflow re-runs and `changesets/action` moves the branch head as the bot
# again, dropping the PR back to zero checks. That is not the escape having failed; just repeat it.
#
# Do NOT unstick it by deleting or weakening the ruleset. See the branch-protection section of
# CLAUDE.md. (Fixing this properly for the whole org means giving `changesets/action` a PAT in
# cosyte/.github, which is not a per-repo change.)

on:
  push:
    branches: [main]

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@main
    with:
      package-name: "@cosyte/deid"
    secrets: inherit
