name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish through npm trusted
# publishing (OIDC, with provenance; the publish uses no npm token) -> docs artifacts -> GitHub
# release -> repository_dispatch to cosyte/docs. Uses the DOCS_REPO_DISPATCH_TOKEN and
# RELEASE_PR_TOKEN secrets (passed via `secrets: inherit`), the second so the "Version Packages"
# pull request it opens runs its checks. The trusted publisher registered for this package on
# npmjs.com names this repository, this file (`release.yml`) and the `release` environment, so
# renaming the file or the environment stops every publish.
#
# ▶ THE "Version Packages" PR IS AUTHORED THROUGH RELEASE_PR_TOKEN, so its checks run as they do on
# any pull request and it merges like one. It used to be opened as `github-actions[bot]` with the
# default GITHUB_TOKEN, which starts no workflow runs, so it sat with zero check runs until someone
# pushed to it; documentation/agent-notes.md#the-version-packages-pr-is-blocked-by-design keeps that
# history. If one ever arrives with no checks, look at that token first, and never unstick it by
# weakening the ruleset (`bypass_actors` is empty on purpose).

on:
  push:
    branches: [main]

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@workflows-2026-11-07-498c7c13c886
    with:
      package-name: "@cosyte/deid"
    secrets: inherit
