name: Release smoke

# Runs `pnpm smoke` (scripts/smoke.mjs) against the freshly built `dist/`: every published subpath
# loaded in BOTH ESM and CJS, the shared-core chunk proven by using a root-created `DeidContext` from
# a different subpath, and a seeded synthetic sentinel asserted not to survive the built artifact.
#
# ▶ WHY THIS FILE EXISTS AT ALL, STATED PLAINLY. `pnpm smoke` was described in CHANGELOG.md and in
# its own header as a CI gate after `build`, and it ran in NO job, here or upstream. It had only ever
# run in the meta-repo's local `scripts/verify.sh`. A documented gate that never executes is worse
# than a missing one: it makes the docs assert a protection nothing provides. This job is what makes
# that description true.
#
# ▶ IT IS NOT THE SAME CHECK AS THE SHARED PIPELINE'S "Dual ESM/CJS smoke". That upstream step is
# ROOT ENTRY ONLY: it stats `dist/index.{mjs,cjs,d.ts}` and imports/requires the root. It cannot see
# a broken `./hl7` subpath, a missing headline export, a regressed shared-core chunk, or a leak.
# Keep both; this one does not replace it, and deleting the upstream step is not this job's call.
#
# ▶ WHY A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml. `ci.yml` is a thin caller of
# cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no arbitrary repo
# script, so the gate cannot go upstream without landing on every other caller at once. Within this
# repo, keeping it out of ci.yml also keeps the two context-naming conventions from being mixed in
# one file: ci.yml's contexts are `ci / <upstream job>` because `ci` is a reusable-workflow caller,
# and this one's is the bare job id below. Same shape as `no-internal-refs` in the sibling repos.
#
# ▶ THE JOB ID IS THE CHECK-RUN CONTEXT NAME, AND THE MATRIX IS PART OF IT. The `ci-required-checks`
# ruleset on `main` requires the contexts this file produces, verbatim:
#
#     smoke (22)
#     smoke (24)
#
# `smoke` is the job id; the suffix is the `node` matrix value. Rename the job or change the matrix
# and the required context stops being emitted at all, which does NOT fail a PR: it leaves every PR
# PENDING and unmergeable forever. Update the ruleset in the same change, and read the real name off
# a live check run (`gh api repos/cosyte/deid/commits/<sha>/check-runs --jq '.check_runs[].name'`),
# never off the `name:` at the top of this file.
#
# ▶ A REQUIRED JOB GATES ALL OF ITS STEPS, so `build` and `smoke` are steps of ONE job on purpose.
# Promote either to its own job and it is silently no longer required, with no error anywhere.
#
# ▶ AND THE JOB BOUNDARY IS NOT THE ONLY WAY TO LOSE THIS GATE, which is the failure this repo has
# already made once. The set of subpaths the smoke loads is NOT a list inside the script: it is read
# from `package.json`'s `exports` at run time, and the script REFUSES to run if its per-subpath
# headline-export map and that `exports` map disagree. That is what stops the gate from being
# narrowed under a green check the way `test/corpus/` can be narrowed by editing the `include` glob
# in vitest.config.ts. If you ever replace that derivation with a hand-written array here or there,
# this job goes back to reporting green over whatever subset someone last remembered to list.
#
# The Node matrix mirrors `ci / verify`, because module resolution of `exports`, ESM/CJS interop and
# `require` of a dual package is exactly the kind of thing that moves between Node majors, and the
# floor is `engines.node >= 22`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `build` and `smoke` are one job deliberately: see the banner. The smoke reads the BUILT
      # `dist/`, so a build in a different job would need an artifact hand-off and would drop the
      # build out of the required context.
      - run: pnpm build
      - run: pnpm smoke
