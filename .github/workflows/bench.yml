name: Bench

# A reading of this build on a GitHub-hosted runner: throughput, latency p50/p95/p99, allocations
# per operation, peak heap, a long run for leaks, and the cold import with every file it loads and
# its gzip size, for every case of bench/deid.bench.mjs, the large sizes included, with the budgets
# read from it (bench/budgets.mjs). Then the cold import of each published entry on its own
# (bench/imports.mjs), and the profile (bench/profile.mjs): peak memory with every byte counted and
# the single-call time of every large size, throughput from each shape's smallest size to its
# largest, and a CPU and a sampled heap profile of the hottest paths.
#
# On demand, and on a pull request that changes the bench or this file, so a change to what is
# measured is measured where it will be read. ADVISORY: it fails only when it cannot measure (a
# suite that does not load, a process that dies, a results file that does not match the schema),
# never on a number, and it is never a required check. The numbers are kept as artifacts and shown
# in each job's summary.
#
# One reading job per format, side by side, so the reading finishes inside a pull request's wait:
# each runs its format's two benchmarks (text in, text out, and the adapter on a parsed model) at
# every size. Jobs on different runners are not compared with each other; each reading names the
# machine it ran on.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reading:
    name: reading (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: hl7
            first: "HL7 v2: text in, text out"
            second: "HL7 v2: adapter on a parsed model"
          - slug: fhir
            first: "FHIR R4: text in, text out"
            second: "FHIR R4: adapter on a parsed model"
          - slug: ccda
            first: "C-CDA: text in, text out"
            second: "C-CDA: adapter on a parsed model"
          - slug: x12
            first: "X12 837P: text in, text out"
            second: "X12 837P: adapter on a parsed model"
          - slug: dicom
            first: "DICOM: text in, text out"
            second: "DICOM: adapter on a parsed model"
          - slug: engine
            first: "policy engine: Safe Harbor"
            second: "policy engine: keyed"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The lowest Node line the package supports, the one the bench-compare job runs on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read ${{ matrix.slug }}
        env:
          FIRST: ${{ matrix.first }}
          SECOND: ${{ matrix.second }}
          SLUG: ${{ matrix.slug }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results
          status=0
          pnpm bench:reading --commit "${COMMIT}" --only "${FIRST}" --only "${SECOND}" \
            --out "bench-results/reading-${SLUG}.json" \
            --summary "bench-results/reading-${SLUG}.md" || status=$?
          if [ -f "bench-results/reading-${SLUG}.md" ]; then
            cat "bench-results/reading-${SLUG}.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          # Exit 2 with a results file is a measure the reading skipped, named in it with its typed
          # reason (a warmup that did not settle, an allocation window that always collected): a
          # skip is reported, never read as a number. Anything else is a reading that failed.
          if [ "${status}" -eq 2 ] && [ -f "bench-results/reading-${SLUG}.json" ]; then
            echo "::notice::bench reading ${SLUG}: a measure was skipped; its reason is in the results"
          elif [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          pnpm exec cosyte-bench check "bench-results/reading-${SLUG}.json"
      - name: Budgets
        env:
          SLUG: ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:budgets "bench-results/reading-${SLUG}.json" \
            --summary "bench-results/budgets-${SLUG}.md"
          { echo; cat "bench-results/budgets-${SLUG}.md"; } >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the reading
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reading-${{ matrix.slug }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 30

  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cold import of each published entry
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:imports --out bench-results/imports --summary bench-results/imports/imports.md
          cat bench-results/imports/imports.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the imports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-imports
          path: bench-results/imports/
          if-no-files-found: warn
          retention-days: 30

  profile:
    name: profile (${{ matrix.section }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        section: [memory, throughput, cpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Profile (${{ matrix.section }})
        env:
          SECTION: ${{ matrix.section }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:profile --only "${SECTION}" --out "bench-results/profile-${SECTION}"
          cat "bench-results/profile-${SECTION}/profile.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-profile-${{ matrix.section }}
          path: bench-results/profile-${{ matrix.section }}/
          if-no-files-found: warn
          retention-days: 30
