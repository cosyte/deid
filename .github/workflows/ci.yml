name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:41 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ▶ THESE JOB NAMES ARE LOAD-BEARING. The repository ruleset `ci-required-checks` requires the
  # check-run contexts this caller produces, verbatim:
  #     ci / verify (22, ubuntu-latest)
  #     ci / verify (24, ubuntu-latest)
  #     ci / actionlint
  # The `ci /` prefix is the caller job id below; `verify` / `actionlint` are the job ids in the
  # shared pipeline; the matrix suffix is `node` then `os`. Rename the job below, change the Node
  # matrix, or rename a job upstream in cosyte/.github, and a required context stops being emitted
  # at all: that does not fail a PR, it leaves it PENDING and unmergeable forever. Update the
  # ruleset in the same change.
  #
  # Never pass `run-actionlint: false`. The upstream job carries `if: ${{ inputs.run-actionlint }}`,
  # and a job skipped by a condition SATISFIES its required context (measured in cosyte/.github#46;
  # that repository's README, "What a skipped required context does to a merge"), so the lint would
  # stop gating while the ruleset still lists `ci / actionlint`. The nightly run used to switch it
  # off because the shared job reported through reviewdog, which fails on a `schedule` event; since
  # the reference below it runs rhysd/actionlint's own release over every tracked workflow file and
  # reads no event payload, so it runs on every event here.
  #
  # ▶ AND: a required JOB gates all of its STEPS. `verify` runs typecheck, lint, format:check, the
  # PHI scan, tests, the gating coverage run, build, attw and the dual ESM/CJS smoke as steps inside
  # one required context. Promote any of those to its own job and it is silently NO LONGER REQUIRED,
  # with no error anywhere: the ruleset still passes because the job it names still passes.
  # Splitting a step out means adding its new context to the ruleset in the same change.
  #
  # ▶ AND THE JOB BOUNDARY IS NOT THE ONLY WAY TO LOSE A GATE. The PHI scan is a step, so the rule
  # above covers it. The leak/over-scrub corpus is NOT: it is `test/corpus/`, selected by the
  # `include` glob in vitest.config.ts and run inside the `test` / `test:coverage` steps. Narrowing
  # that glob, moving the files out of `test/`, or `.skip`-ing the suite drops this repo's headline
  # leak gate with no workflow change, no job change, and NOTHING for the ruleset to notice. A
  # ruleset can only bind a context; it cannot tell you the context still means what it meant.
  #
  # ▶ THE GATE THAT USED TO BE MISSING HERE NOW LIVES NEXT DOOR, in `.github/workflows/smoke.yml`.
  # `pnpm smoke` (scripts/smoke.mjs: every published subpath in ESM and CJS off the built dist/, the
  # shared-core chunk, no HL7 leak) was documented as a CI gate after `build` while running in no job
  # at all. It now runs as its own workflow on `pull_request`, and its contexts `smoke (22)` /
  # `smoke (24)` are required by the same ruleset that requires the contexts above. Do NOT read the
  # upstream `Dual ESM/CJS smoke` STEP in `verify` as that gate: it is root-entry only (stat + import
  # + require of `dist/index.*`) and cannot see a broken subpath, a missing export, or an HL7 leak.
  #
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on its default Node matrix, 22, 24 and 26 (ST15: we claim only
  # the lines CI runs). Repo-specific extra jobs (e.g. an examples smoke, a starter-kit build) are
  # added on top of this caller, never instead of it. This repository's own PHI scanner
  # (scripts/phi-scan.ts, with field-level detection for each format) runs as the shared pipeline's
  # optional PHI-scan step.
  #
  # Called at a published reference, never `@main` (ST37): a `workflows-*` release of cosyte/.github.
  # Those releases are immutable, so the tag names one commit and cannot be moved, and every caller
  # in this repository moves to the next one together, by hand. A job that calls a reusable workflow
  # cannot carry `timeout-minutes`; the shared jobs set their own.
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request waits
  # for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates on each format adapter and on the policy
  #   engine, and their self-checks, never under coverage. A skipped job satisfies a required
  #   check, so require `ci / scaling-gate` only while its input below stays on.
  # - `bench-compare` (pull requests only): bench/deid.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner, at each format's smallest size and the engine's. The
  #   target is bench/target.mjs, which gathers every built entry of its own checkout, because the
  #   adapters are subpaths and the shared job hands a suite one module. Advisory: it never fails,
  #   so never require it. The large sizes are measured by bench.yml's reading instead.
  #
  # The testing standard's jobs run beside them too:
  # - `verify` on Linux, Windows and macOS (`os` below), each on Node 22, 24 and 26. The contexts
  #   the ruleset names, `ci / verify (<22, 24>, ubuntu-latest)`, are still emitted verbatim; the
  #   Windows and macOS ones are new and not required yet.
  # - `bun`: `pnpm test` under Bun. The `deno` job is not on yet: under Deno 2.9.8 every DICOM
  #   write fails inside `@cosyte/dicom`'s `serializeDicom` (a RangeError from `Buffer.compare`),
  #   so every DICOM case would be red there; the rest of the suite passes under Deno. Turn on
  #   `run-deno` once that writer runs under Deno.
  # - `coverage-ratchet`: the coverage run held to `quality-floor.json` by `cosyte-ratchet`, and on
  #   a pull request every changed line it counts held to having run.
  # - `mutation` (pull requests only): StrykerJS over the source files the pull request changed
  #   (`pnpm exec cosyte-mutate changed`), and every mutant in its changed lines must be killed.
  #   The full run is weekly, sharded, in `weekly-mutation.yml`, and holds the whole score to the
  #   floor.
  # A job skipped by a condition satisfies a required context, so require any of these only while
  # its input below stays on.
  #
  # This caller, `weekly-mutation.yml` and `nightly-properties.yml` are one release ahead of the
  # others: the release of commit 398cd4ded647 is the first with every one of those jobs. Its name
  # carries its date, which a PHI scan of a changed file can read as a date of service, so the
  # comment names its commit instead. `release.yml` stays where it is: from this release on the
  # shared release gates a publish on a recent weekly mutation result, and there is none until the
  # first weekly run on `main`. The other callers move with the next change to them.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # the release of 398cd4ded647
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      run-phi-scan: true
      run-bun: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/deid.bench.mjs
      bench-target: bench/target.mjs

  # The programs under examples/, run against the BUILT package the way a consumer imports it:
  # `pnpm examples` (scripts/run-examples.ts) fails when any example exits non-zero, and each
  # example checks its own output, the fail-closed cases included. Added on top of the caller above,
  # never instead of it. Its contexts, `examples (22)` and `examples (24)`, are new and deliberately
  # NOT in the `ci-required-checks` ruleset yet: let them run on `main` first, then read the real
  # names off a live check run before requiring them.
  examples:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the examples import the built package)
        run: pnpm build
      - name: Run every example
        run: pnpm examples

  # The house checks on this repository's documents and its catalog entry, from @cosyte/script-utils
  # (RD1, RD2, PF1): the README against the house skeleton and npm's size limit
  # (`pnpm check:readme`), the CLAUDE.md card against its spec (`pnpm check:claude-card`), and the
  # package description against the catalog that ships in script-utils (`pnpm check:catalog`), and
  # the script wiring against @cosyte/process (`pnpm check:process`). The context, `documents`, is
  # required by the `ci-required-checks` ruleset: rename the job and the ruleset together.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README follows the house skeleton
        run: pnpm check:readme
      - name: The CLAUDE.md card follows its spec
        run: pnpm check:claude-card
      - name: The package description is the catalog's
        run: pnpm check:catalog
      - name: The scripts delegate to @cosyte/process
        run: pnpm check:process
