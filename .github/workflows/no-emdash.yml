name: Em-dash gate

# The brand rule (ST8): no em dash (U+2014) and no en dash (U+2013) on any Cosyte surface, commit
# messages included. The gate is the shared one (ST34): `pnpm check:no-emdash` runs
# `cosyte-no-emdash` from @cosyte/script-utils, which matches the characters and every encoded
# form of them, in tracked files and in their names. What this repository leaves out, and why, is
# in `scripts/check-no-emdash.exclude`, which the gate reads for itself.
#
# TWO JOBS, from the shared gate workflow this file calls:
#
#   tracked-files   every tracked file and file name. Nothing outside this repository can put a
#                   dash into a tracked file, so a hit is always something written here.
#   messages        the pull request's title, its body, and every commit message in its range,
#                   which a squash merge composes into the commit that lands. A bot composes some
#                   pull-request bodies from upstream release notes, dashes included.
#
# NEITHER CONTEXT IS REQUIRED YET. The contexts are `no-emdash / tracked-files` and
# `no-emdash / messages`; the shared README says to require the first and never the second, since a
# Dependabot body must not block a merge. Requiring one is a ruleset change, made after the
# workflow has run on `main`, and the job id below is part of both names.
#
# The installing form of the shared gate, because the gate lives in node_modules: it installs from
# the committed lockfile before it scans. Nothing here may continue past a failure.
#
# Run either half locally: `pnpm check:no-emdash`, and
# `pnpm check:no-emdash --stdin "the PR text" < body.md` for a title, body or commit message.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is load-bearing: with squash merges the title and body ARE the commit message that
    # lands, so a retitled or re-described pull request is scanned again.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # A published reference (ST37): a `workflows-*` release of cosyte/.github. Those releases
    # are immutable, so the tag is locked to one commit, and every caller in this repository
    # moves to the next reference together. The installing form: the gate lives in node_modules.
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
