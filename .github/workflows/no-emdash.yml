name: Em-dash gate

# Founder directive, 2026-07-24, widened by the operator on 2026-11-07: the em dash (U+2014) and the
# en dash (U+2013) are banned outright across every Cosyte surface, and COMMIT MESSAGES ARE NAMED
# EXPLICITLY. The rule is stated canonically in the brand voice document; `scripts/check-no-emdash.sh`
# is what enforces it here, and this file is what runs it. Plain hyphens only.
#
# NEITHER CHARACTER IS SPELLED ANYWHERE IN THIS REPOSITORY, THIS FILE INCLUDED. The tracked-file
# scan below is `git ls-files` over the whole tree with no exemption for the gate's own source, its
# own tests or this workflow, so writing either glyph out here would red this job on itself. That is
# the correct outcome: the checker constructs each character from its code point instead.
#
# ---------------------------------------------------------------------------
# TWO JOBS, DELIBERATELY, AND THE SPLIT IS THE DESIGN RATHER THAN A TIDINESS CHOICE.
#
#   tracked-files       the TRACKED-FILE scan. Nothing outside this repository can put a character
#                       into a tracked file, so a hit is always something an author here wrote and
#                       clearing one is always a text edit inside this tree. This is the half that
#                       guards what a consumer reads.
#   messages            the MESSAGE scan: the pull request's title, its body, and every commit
#                       message in its range. That text has a different trust profile. A bot
#                       composes a pull-request body by pasting upstream release notes, em dashes
#                       included, and no edit inside this tree prevents it.
#
# They are separate JOBS inside the shared gate workflow this file calls, so they emit SEPARATE
# CHECK-RUN CONTEXTS and are separately addressable. A sibling repository shipped both halves as
# one job, found the message half noisy, and exempted the whole job: that un-protected the
# tracked-file half too. Keeping them apart is what makes any future decision about the message
# half safe to take on its own.
#
# ▶ NEITHER CONTEXT IS REQUIRED, AND NOTHING HERE MAKES ONE REQUIRED. Adding a context to this
# repository's branch ruleset is a GitHub settings act with a precondition (the workflow must first
# have completed on `main`), it is not a file in this repository, and it is out of scope for the
# change that adds this gate. This repository has already paid the cost of getting that order wrong
# twice: a required context a branch cannot yet emit leaves every pull request PENDING and
# unmergeable, with nothing anywhere saying why. Wire the workflow first, let it run on `main`, then
# require a context as its own deliberate change, and read a real context name off a live check run
# rather than off the `name:` at the top of this file.
#
# ▶ A CALLED JOB'S CHECK RUN IS NAMED `<caller job id> / <inner job id>`, so the job id below
# publishes `no-emdash / tracked-files` and `no-emdash / messages`. If either context is ever added
# to the ruleset, rename the job and the ruleset together or neither: a required context nothing
# emits blocks every pull request.
#
# ---------------------------------------------------------------------------
# WHY A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml. Same reasoning as the three gate workflows next
# door, and the first half is the deciding one:
#
#   `ci.yml` is a THIN CALLER of cosyte/.github's shared `ci.yml`, which runs a fixed ladder and
#   no arbitrary repository script, so there is nowhere in it to hang this rule. The
#   shared GATE workflow this file now calls is a different thing: it carries no pattern, no
#   allow-list and no file selection of its own, and it exists precisely so the machinery can be
#   shared while the rule stays in the repository it governs.
#
#   Within this repository, keeping it out of ci.yml also keeps it cheap: the tracked-file job is a
#   checkout and one grep pass over a small tree, with no install and no build, while ci.yml drives
#   the full Node 22 + 24 matrix.
#
# ---------------------------------------------------------------------------
# NOTHING HERE CAN FAIL SILENTLY, AND THAT IS ASSERTED RATHER THAN PROMISED. Nothing is marked to
# keep going past a failure, no command has its exit status discarded, and no condition swallows a
# result. `test/scripts/no-emdash.test.ts` reads this file back and fails if any of those appear.
# The checker self-tests before it reports anything, including an end-to-end pass over a seeded
# file, so a green from it is a green from a detector that has just been shown able to red.
#
# Run either half locally: `pnpm check:no-emdash`, and `pnpm check:no-emdash --messages` with
# PR_TITLE, PR_BODY, PR_BASE_SHA and PR_HEAD_SHA set.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is load-bearing: with squash merges the title and body ARE the commit message that
    # lands, so a retitled or re-described pull request is scanned again.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # A published reference (ST37): a `workflows-*` release of cosyte/.github. Those releases
    # are immutable, so the tag is locked to one commit, and every caller in this repository
    # moves to the next reference together.
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
