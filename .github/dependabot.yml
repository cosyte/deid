version: 2

# Two ecosystems, because the repository has exactly two dependency surfaces: npm (`package.json`
# and `pnpm-lock.yaml` at the root, the only manifest) and github-actions (`.github/workflows/`).
# The shape is the parser template's in cosyte/config (EN5): weekly, one pull request per group, and
# a release becomes eligible a day after it is published (`cooldown`), which keeps a release pulled
# within hours out of this repository. Security updates are not delayed.
#
# Every commit message, and so every pull request title, is `chore(deps): bump ...` or
# `chore(deps-dev): bump ...`: Conventional Commits, which `pr-title.yml` checks (ST24). Without a
# prefix Dependabot guesses one from the history, and a guess is not a title rule.
#
# This package ships ZERO runtime dependencies (`dependencies` is `{}` and stays that way; every
# primitive is `node:crypto`), so the npm group that matters is the development one. The six sibling
# parsers are optional peers installed for the tests as registry devDependencies, so this entry
# watches the versions the tests exercise: `@cosyte/deid/dicom` delegates its pass to `@cosyte/dicom`,
# and an upstream change arrives as a grouped bump that runs the DICOM suites before it lands.
# `pnpm.overrides` pins esbuild and js-yaml above advisory ranges, and Dependabot does not manage
# overrides: when a bump makes one redundant, remove it by hand.
#
# The cosyte/.github callers name a published `workflows-*` reference, which moves by hand with every
# caller here (ST37), not through this file. Majors wait for the toolchain-upgrade pass (EN10).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    ignore:
      # @types/node describes the oldest Node.js this package runs on (engines: >=22), so it stays
      # on the 22 line. A newer major type-checks calls that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cosyte/process owns the vitest, typescript and prettier versions; this repository declares
      # them directly only because tests import vitest, the compiler API and prettier, pinned to
      # exactly the versions process runs. They move when process does, never on their own.
      - dependency-name: "vitest"
      - dependency-name: "typescript"
      - dependency-name: "prettier"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. The
      # shared CI runs the official rhysd/actionlint release, checked by its SHA-256, instead.
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together (ST37). Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"
